
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Medispot BD | Order Management</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f7f5;color:#18352b;font-family:"Noto Sans Bengali","Hind Siliguri",Arial,sans-serif}
header{background:#075e46;color:white;padding:22px 16px}
header h1{margin:0;font-size:23px}
header p{margin:7px 0 0;color:#d5f3e6;font-size:13px}
main{max-width:1100px;margin:auto;padding:18px}
.panel,.stat,.order{background:white;border:1px solid #e1ebe5;border-radius:14px;padding:17px;margin-bottom:15px}
h2{font-size:18px;margin:0 0 15px}
input,button,select{font:inherit;padding:11px;border-radius:9px;border:1px solid #d4e1d9}
input{width:100%;margin-bottom:10px}
button{cursor:pointer;background:#087653;color:white;border:0;font-weight:bold}
button:disabled{opacity:.5;cursor:wait}
.secondary{background:#e7f3ed;color:#075e46}
.danger{background:#a72c2c;color:white}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.stat strong{display:block;font-size:25px;margin-top:8px}
.muted{color:#6c7c73;font-size:13px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.order h3{margin:0 0 8px;font-size:17px}
.order table{width:100%;border-collapse:collapse;margin-top:12px;font-size:13px}
th,td{text-align:left;border-bottom:1px solid #e5ece7;padding:9px 5px}
.tablewrap{overflow-x:auto}
.tag{background:#e6f5ed;color:#075e46;padding:5px 8px;border-radius:7px;font-size:12px}
#dashboard{display:none}
#message{white-space:pre-wrap;font-size:13px;margin-top:10px}
.filters{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px}
.filters input,.filters select{width:100%;margin:0}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.actions select{max-width:160px}
.customer-photo{margin:14px 0;padding:13px;border:1px solid #cfe6d8;border-radius:12px;background:#f5fbf7}
.customer-photo h4{margin:0 0 8px;color:#075e46;font-size:14px}
.customer-photo img{display:block;width:auto;max-width:100%;max-height:320px;object-fit:contain;border-radius:9px;border:1px solid #dce8e0;background:#fff}
.customer-photo a{display:inline-block;margin-top:8px;color:#075e46;font-weight:bold;font-size:13px}
.photo-missing{font-size:13px;color:#6c7c73}
.connection{font-size:12px;padding:6px 9px;border-radius:7px;background:#e7f3ed;color:#075e46}
.connection.offline{background:#fff0e8;color:#9b451d}
.empty{padding:25px;text-align:center}
@media(max-width:650px){
  .grid{grid-template-columns:1fr 1fr}
  .filters{grid-template-columns:1fr}
  main{padding:12px}
  .panel,.order{padding:13px}
  .actions select{max-width:100%;width:100%}
}
@media print{body{background:white}.no-print{display:none!important}}
.package-tag{display:inline-block;margin:3px 0;padding:2px 7px;border-radius:6px;background:#e6f4ee;color:#0b6b4f;font-size:11px;font-weight:700}\n</style>
</head>

<body>
<header>
  <h1>Medispot BD</h1>
  <p>Order Management Dashboard</p>
</header>

<main>
  <section id="login" class="panel">
    <h2>Admin Login</h2>
    <p class="muted">&#2468;&#2507;&#2478;&#2494;&#2480; Supabase Admin account &#2470;&#2495;&#2479;&#2492;&#2503; &#2482;&#2455;&#2439;&#2472; &#2453;&#2480;&#2507;à¥¤</p>
    <input id="email" type="email" placeholder="Admin email" autocomplete="username">
    <input id="password" type="password" placeholder="Password" autocomplete="current-password">
    <button id="loginBtn" onclick="login()">Login to Dashboard</button>
    <div id="message"></div>
  </section>

  <section id="dashboard">
    <div class="row no-print" style="margin-bottom:15px">
      <div>
        <h2 style="margin-bottom:5px">&#2437;&#2480;&#2509;&#2465;&#2494;&#2480; &#2478;&#2509;&#2479;&#2494;&#2472;&#2503;&#2460;&#2478;&#2503;&#2472;&#2509;&#2463;</h2>
        <div class="muted">&#2472;&#2468;&#2497;&#2472; &#2437;&#2480;&#2509;&#2465;&#2494;&#2480; &#2447;&#2482;&#2503; &#2468;&#2494;&#2482;&#2495;&#2453;&#2494; &#2438;&#2474;&#2465;&#2503;&#2463; &#2489;&#2476;&#2503;à¥¤ &#2474;&#2509;&#2480;&#2479;&#2492;&#2507;&#2460;&#2472;&#2503; Refresh &#2458;&#2494;&#2474;&#2507;à¥¤</div>
        <p><span id="connectionStatus" class="connection">Realtime &#2474;&#2480;&#2496;&#2453;&#2509;&#2487;&#2494; &#2489;&#2458;&#2509;&#2459;&#2503;...</span></p>
      </div>
      <div class="actions">
        <button class="secondary" onclick="enableNotifications()">Notification &#2458;&#2494;&#2482;&#2497;</button>
        <button onclick="loadOrders()">Refresh</button>
        <button class="danger" onclick="logout()">Logout</button>
      </div>
    </div>

    <div class="grid">
      <div class="stat">
        <span class="muted">&#2470;&#2503;&#2454;&#2494;&#2472;&#2507; &#2437;&#2480;&#2509;&#2465;&#2494;&#2480;</span>
        <strong id="totalCount">0</strong>
      </div>
      <div class="stat">
        <span class="muted">Pending</span>
        <strong id="pendingCount">0</strong>
      </div>
      <div class="stat">
        <span class="muted">&#2470;&#2503;&#2454;&#2494;&#2472;&#2507; &#2437;&#2480;&#2509;&#2465;&#2494;&#2480;&#2503;&#2480; &#2478;&#2507;&#2463; &#2478;&#2498;&#2482;&#2509;&#2479;</span>
        <strong id="totalAmount">&#2547;0</strong>
      </div>
    </div>

    <div class="panel no-print">
      <div class="filters">
        <input id="search" placeholder="&#2437;&#2480;&#2509;&#2465;&#2494;&#2480; &#2472;&#2478;&#2509;&#2476;&#2480; / &#2475;&#2494;&#2480;&#2509;&#2478;&#2503;&#2488;&#2495; / &#2475;&#2507;&#2472; &#2470;&#2495;&#2479;&#2492;&#2503; &#2454;&#2497;&#2433;&#2460;&#2497;&#2472;" oninput="renderOrders()">
        <input id="dateFilter" type="date" aria-label="&#2468;&#2494;&#2480;&#2495;&#2454; &#2437;&#2472;&#2497;&#2479;&#2494;&#2479;&#2492;&#2496; &#2437;&#2480;&#2509;&#2465;&#2494;&#2480;" onchange="renderOrders()">
        <select id="filter" onchange="renderOrders()">
          <option value="">&#2488;&#2476; Status</option>
          <option value="pending">Pending</option>
          <option value="confirmed">Confirmed</option>
          <option value="processing">Processing</option>
          <option value="shipped">Shipped</option>
          <option value="delivered">Delivered</option>
          <option value="cancelled">Cancelled</option>
        </select>
      </div>
      <div class="actions" style="margin-top:10px">
        <button class="secondary" onclick="clearFilters()">&#2488;&#2476; &#2468;&#2494;&#2480;&#2495;&#2454;&#2503;&#2480; &#2437;&#2480;&#2509;&#2465;&#2494;&#2480;</button>
      </div>
    </div>

    <div id="ordersList"><p class="muted">&#2437;&#2480;&#2509;&#2465;&#2494;&#2480; &#2482;&#2507;&#2465; &#2489;&#2458;&#2509;&#2459;&#2503;...</p></div>
  </section>
</main>

<script>
const SUPABASE_URL = "https://pnaaqkuzazjiabnnwxjq.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_ckj65sbFnET7xOjxPJOwfw_-KrevOkv";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);

let orders = [];
let ordersChannel = null;
let loadingOrders = false;
let reloadQueued = false;
let notifiedIds = new Set();
let notificationPermissionAsked = false;

function msg(text){
  document.getElementById("message").textContent = text;
}

function money(value){
  return "\u09F3" + Number(value || 0).toLocaleString("en-BD", {
    maximumFractionDigits: 2
  });
}

function escapeHtml(value){
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  }[c]));
}

function dateKey(value){
  if(!value) return "";
  const d = new Date(value);
  if(Number.isNaN(d.getTime())) return "";
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,"0");
  const day = String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}

function formatDate(value){
  if(!value) return "-";
  const d = new Date(value);
  return Number.isNaN(d.getTime()) ? "-" : d.toLocaleString("bn-BD");
}

function setConnectionStatus(text, offline=false){
  const el = document.getElementById("connectionStatus");
  el.textContent = text;
  el.classList.toggle("offline", offline);
}

function showBrowserNotification(title, body, id){
  if(!("Notification" in window)) return;
  if(Notification.permission !== "granted") return;

  // \u098F\u0995\u0987 order ID-\u098F\u09B0 \u099C\u09A8\u09CD\u09AF \u098F\u0995\u0987 session-\u098F \u09AC\u09BE\u09B0\u09AC\u09BE\u09B0 notification \u0986\u099F\u0995\u09BE\u09AF\u09BCà¥¤
  const key = String(id);
  if(notifiedIds.has(key)) return;
  notifiedIds.add(key);

  try{
    new Notification(title, { body });
  }catch(error){
    console.warn("Browser notification failed:", error);
  }
}

async function login(){
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const btn = document.getElementById("loginBtn");

  if(!email || !password){
    msg("Email \u0993 password \u09A6\u09BE\u0993à¥¤");
    return;
  }

  btn.disabled = true;
  msg("Login \u09B9\u099A\u09CD\u099B\u09C7...");

  try{
    const { data, error } = await db.auth.signInWithPassword({
      email,
      password
    });

    if(error) throw error;
    if(!data.session) throw new Error("Login session \u09A4\u09C8\u09B0\u09BF \u09B9\u09AF\u09BC\u09A8\u09BFà¥¤");

    document.getElementById("login").style.display = "none";
    document.getElementById("dashboard").style.display = "block";
    msg("");

    await loadOrders();
    subscribeOrders();
  }catch(error){
    msg("Login \u09B9\u09AF\u09BC\u09A8\u09BF: " + error.message);
  }finally{
    btn.disabled = false;
  }
}

async function logout(){
  await stopOrderSubscription();
  await db.auth.signOut();

  orders = [];
  notifiedIds.clear();

  document.getElementById("dashboard").style.display = "none";
  document.getElementById("login").style.display = "block";
  document.getElementById("password").value = "";
  setConnectionStatus("\u09B2\u0997\u0987\u09A8 \u0995\u09B0\u09BE \u09A8\u09C7\u0987", true);
}

async function stopOrderSubscription(){
  if(!ordersChannel) return;

  const oldChannel = ordersChannel;
  ordersChannel = null;

  try{
    await db.removeChannel(oldChannel);
  }catch(error){
    console.warn("Realtime channel close failed:", error);
  }
}

function clearFilters(){
  document.getElementById("search").value = "";
  document.getElementById("dateFilter").value = "";
  document.getElementById("filter").value = "";
  renderOrders();
}

async function loadOrders(){
  if(loadingOrders){
    reloadQueued = true;
    return;
  }

  loadingOrders = true;
  const list = document.getElementById("ordersList");
  list.innerHTML = '<div class="panel">\u0985\u09B0\u09CD\u09A1\u09BE\u09B0 \u09B2\u09CB\u09A1 \u09B9\u099A\u09CD\u099B\u09C7...</div>';

  try{
    const { data, error } = await db
      .from("orders")
      .select("id,customer_name,pharmacy_name,phone,address,total_amount,status,created_at,items,customer_image_url")
      .order("created_at", { ascending: false })
      .limit(1000);

    if(error) throw error;

    const fresh = await Promise.all((data || []).map(async order => {
      const path = String(order.customer_image_url || "").trim();

      if(!path){
        return { ...order, customerImageSignedUrl: "" };
      }

      try{
        // \u0986\u0997\u09C7 \u09A5\u09C7\u0995\u09C7\u0987 URL \u09A5\u09BE\u0995\u09B2\u09C7 \u09B8\u09C7\u099F\u09BF \u09AC\u09CD\u09AF\u09AC\u09B9\u09BE\u09B0 \u0995\u09B0\u09CBà¥¤
        if(/^https?:\/\//i.test(path)){
          return { ...order, customerImageSignedUrl: path };
        }

        // Private Storage bucket \u09A5\u09C7\u0995\u09C7 \u09B8\u09BE\u09AE\u09AF\u09BC\u09BF\u0995 signed URL \u09A4\u09C8\u09B0\u09BFà¥¤
        const { data: signed, error: signedError } = await db
          .storage
          .from("customer-medicine-photos")
          .createSignedUrl(path, 3600);

        if(signedError){
          console.warn("Customer photo could not be opened:", signedError.message);
          return { ...order, customerImageSignedUrl: "" };
        }

        return {
          ...order,
          customerImageSignedUrl: signed?.signedUrl || ""
        };
      }catch(photoError){
        console.warn("Customer photo error:", photoError);
        return { ...order, customerImageSignedUrl: "" };
      }
    }));

    orders = fresh;
    renderOrders();
  }catch(error){
    list.innerHTML =
      '<div class="panel">\u0985\u09B0\u09CD\u09A1\u09BE\u09B0 \u09B2\u09CB\u09A1 \u09B9\u09AF\u09BC\u09A8\u09BF: ' +
      escapeHtml(error.message) +
      '<p class="muted">Admin SELECT policy, orders \u099F\u09C7\u09AC\u09BF\u09B2\u09C7\u09B0 \u0995\u09B2\u09BE\u09AE \u098F\u09AC\u0982 login session \u09AA\u09B0\u09C0\u0995\u09CD\u09B7\u09BE \u0995\u09B0\u09CBà¥¤</p></div>';

    console.error("Order loading failed:", error);
  }finally{
    loadingOrders = false;

    if(reloadQueued){
      reloadQueued = false;
      loadOrders();
    }
  }
}

function renderOrders(){
  const search = document.getElementById("search").value.toLowerCase().trim();
  const filter = document.getElementById("filter").value;
  const selectedDate = document.getElementById("dateFilter").value;

  const shown = orders.filter(order => {
    const hay = [
      order.id,
      order.customer_name,
      order.pharmacy_name,
      order.phone
    ].join(" ").toLowerCase();

    return (!search || hay.includes(search)) &&
      (!filter || String(order.status || "").toLowerCase() === filter) &&
      (!selectedDate || dateKey(order.created_at) === selectedDate);
  });

  document.getElementById("totalCount").textContent = shown.length;

  document.getElementById("pendingCount").textContent =
    shown.filter(order =>
      String(order.status || "").toLowerCase() === "pending"
    ).length;

  document.getElementById("totalAmount").textContent = money(
    shown.reduce((sum, order) => sum + Number(order.total_amount || 0), 0)
  );

  const list = document.getElementById("ordersList");

  if(!shown.length){
    list.innerHTML = '<div class="panel empty">\u098F\u0987 \u09AB\u09BF\u09B2\u09CD\u099F\u09BE\u09B0\u09C7 \u0995\u09CB\u09A8\u09CB \u0985\u09B0\u09CD\u09A1\u09BE\u09B0 \u09AA\u09BE\u0993\u09AF\u09BC\u09BE \u09AF\u09BE\u09AF\u09BC\u09A8\u09BFà¥¤</div>';
    return;
  }

  list.innerHTML = shown.map(order => {
    const items = Array.isArray(order.items) ? order.items : [];
    const status = String(order.status || "pending").toLowerCase();

    const itemRows = items.length ? items.map(item => {
      const qty = Number(item.quantity ?? item.qty ?? 0);
      const price = Number(item.unit_price ?? item.price ?? item.sale_price ?? 0);
      const packageType = item.package_type === "strip" ? "Strip" : (item.package_type === "box" ? "Box" : "\u0985\u099C\u09BE\u09A8\u09BE");
      const quantityLabel = `${qty} ${packageType}`;

      return `<tr>
        <td>${escapeHtml(item.name || item.medicine_name || item.product_name || "\u0993\u09B7\u09C1\u09A7")}</td>
        <td>${escapeHtml(item.company || item.company_name || "-")}</td>
        <td><span class="package-tag">${quantityLabel}</span></td>
        <td>${money(price)} / ${packageType}</td>
        <td>${money(qty * price)}</td>
      </tr>`;
    }).join("") : '<tr><td colspan="5">\u098F\u0987 \u0985\u09B0\u09CD\u09A1\u09BE\u09B0\u09C7\u09B0 items \u09A4\u09BE\u09B2\u09BF\u0995\u09BE \u09AA\u09BE\u0993\u09AF\u09BC\u09BE \u09AF\u09BE\u09AF\u09BC\u09A8\u09BFà¥¤</td></tr>';

    const photoSection = order.customerImageSignedUrl
      ? `<div class="customer-photo">
          <h4>Customer-\u098F\u09B0 \u0985\u09A4\u09BF\u09B0\u09BF\u0995\u09CD\u09A4 \u0993\u09B7\u09C1\u09A7\u09C7\u09B0 \u099B\u09AC\u09BF</h4>
          <a href="${escapeHtml(order.customerImageSignedUrl)}" target="_blank" rel="noopener noreferrer">
            <img src="${escapeHtml(order.customerImageSignedUrl)}" alt="Customer uploaded medicine photo" loading="lazy">
          </a>
          <a href="${escapeHtml(order.customerImageSignedUrl)}" target="_blank" rel="noopener noreferrer">\u099B\u09AC\u09BF\u099F\u09BF \u09AC\u09A1\u09BC \u0995\u09B0\u09C7 \u09A6\u09C7\u0996\u09C1\u09A8 â</a>
        </div>`
      : (order.customer_image_url
          ? `<div class="customer-photo">
              <h4>Customer-\u098F\u09B0 \u0985\u09A4\u09BF\u09B0\u09BF\u0995\u09CD\u09A4 \u0993\u09B7\u09C1\u09A7\u09C7\u09B0 \u099B\u09AC\u09BF</h4>
              <p class="photo-missing">\u099B\u09AC\u09BF\u099F\u09BF \u0996\u09CB\u09B2\u09BE \u09AF\u09BE\u099A\u09CD\u099B\u09C7 \u09A8\u09BEà¥¤ Admin login \u098F\u09AC\u0982 Storage SELECT policy \u09AA\u09B0\u09C0\u0995\u09CD\u09B7\u09BE \u0995\u09B0\u09CBà¥¤</p>
            </div>`
          : "");

    return `<article class="order" data-order-id="${escapeHtml(order.id)}">
      <div class="row">
        <div>
          <h3>\u0985\u09B0\u09CD\u09A1\u09BE\u09B0 #${escapeHtml(order.id)}</h3>
          <span class="muted">${escapeHtml(formatDate(order.created_at))}</span>
        </div>
        <span class="tag">${escapeHtml(status.toUpperCase())}</span>
      </div>

      <hr style="border:0;border-top:1px solid #e5ece7;margin:14px 0">

      <p><b>\u0985\u09B0\u09CD\u09A1\u09BE\u09B0\u0995\u09BE\u09B0\u09C0\u09B0 \u09A8\u09BE\u09AE:</b> ${escapeHtml(order.customer_name || "-")}</p>
      <p><b>\u09AB\u09BE\u09B0\u09CD\u09AE\u09C7\u09B8\u09BF:</b> ${escapeHtml(order.pharmacy_name || "-")}</p>
      <p><b>\u09AB\u09CB\u09A8:</b> ${escapeHtml(order.phone || "-")}</p>
      <p><b>\u09A0\u09BF\u0995\u09BE\u09A8\u09BE:</b> ${escapeHtml(order.address || "-")}</p>

      ${photoSection}

      <h3>\u0993\u09B7\u09C1\u09A7\u09C7\u09B0 \u09A4\u09BE\u09B2\u09BF\u0995\u09BE</h3>
      <div class="tablewrap">
        <table>
          <thead>
            <tr>
              <th>\u0993\u09B7\u09C1\u09A7</th>
              <th>\u0995\u09CB\u09AE\u09CD\u09AA\u09BE\u09A8\u09BF</th>
              <th>\u09AA\u09CD\u09AF\u09BE\u0995\u09C7\u099C \u0993 \u09AA\u09B0\u09BF\u09AE\u09BE\u09A3</th>
              <th>\u098F\u0995\u0995 \u09A6\u09BE\u09AE</th>
              <th>\u09AE\u09CB\u099F</th>
            </tr>
          </thead>
          <tbody>${itemRows}</tbody>
        </table>
      </div>

      <div class="row" style="margin-top:14px">
        <b>\u0985\u09B0\u09CD\u09A1\u09BE\u09B0\u09C7\u09B0 \u09AE\u09CB\u099F: ${money(order.total_amount)}</b>
        <div class="actions no-print">
          <select class="status-select" aria-label="\u0985\u09B0\u09CD\u09A1\u09BE\u09B0\u09C7\u09B0 Status">
            <option value="pending" ${status==="pending"?"selected":""}>Pending</option>
            <option value="confirmed" ${status==="confirmed"?"selected":""}>Confirmed</option>
            <option value="processing" ${status==="processing"?"selected":""}>Processing</option>
            <option value="shipped" ${status==="shipped"?"selected":""}>Shipped</option>
            <option value="delivered" ${status==="delivered"?"selected":""}>Delivered</option>
            <option value="cancelled" ${status==="cancelled"?"selected":""}>Cancelled</option>
          </select>
          <button onclick="updateStatus(this)">Save Status</button>
          <button class="secondary" onclick="printReceipt(this)">Receipt / PDF</button>
          <button class="danger" onclick="deleteOrder(this)">Delete Order</button>
        </div>
      </div>
    </article>`;
  }).join("");
}

async function updateStatus(button){
  const card = button.closest(".order");
  if(!card) return;

  const id = card.dataset.orderId;
  const select = card.querySelector(".status-select");
  const status = select.value;

  button.disabled = true;
  const originalText = button.textContent;
  button.textContent = "Saving...";

  try{
    const { data, error } = await db
      .from("orders")
      .update({ status })
      .eq("id", id)
      .select("id,status")
      .maybeSingle();

    if(error) throw error;

    if(!data){
      throw new Error(
        "\u0995\u09CB\u09A8\u09CB row update \u09B9\u09AF\u09BC\u09A8\u09BFà¥¤ Admin UPDATE policy \u098F\u09AC\u0982 RLS \u09AA\u09B0\u09C0\u0995\u09CD\u09B7\u09BE \u0995\u09B0\u09CBà¥¤"
      );
    }

    alert("\u09B8\u09CD\u099F\u09CD\u09AF\u09BE\u099F\u09BE\u09B8 \u0986\u09AA\u09A1\u09C7\u099F \u09B9\u09AF\u09BC\u09C7\u099B\u09C7: " + status.toUpperCase());
    await loadOrders();
  }catch(error){
    alert("\u09B8\u09CD\u099F\u09CD\u09AF\u09BE\u099F\u09BE\u09B8 \u09AA\u09B0\u09BF\u09AC\u09B0\u09CD\u09A4\u09A8 \u09B9\u09AF\u09BC\u09A8\u09BF: " + error.message);
  }finally{
    button.disabled = false;
    button.textContent = originalText;
  }
}

async function deleteOrder(button){
  const card = button.closest(".order");
  if(!card) return;

  const id = card.dataset.orderId;

  const confirmed = confirm(
    `\u09B8\u09A4\u09B0\u09CD\u0995\u09A4\u09BE!\n\n\u0985\u09B0\u09CD\u09A1\u09BE\u09B0 #${id} \u09B8\u09CD\u09A5\u09BE\u09AF\u09BC\u09C0\u09AD\u09BE\u09AC\u09C7 \u09A1\u09BF\u09B2\u09BF\u099F \u0995\u09B0\u09A4\u09C7 \u099A\u09BE\u0993?\n\n\u098F\u0987 \u0995\u09BE\u099C \u09AB\u09BF\u09B0\u09BF\u09AF\u09BC\u09C7 \u0986\u09A8\u09BE \u09AF\u09BE\u09AC\u09C7 \u09A8\u09BEà¥¤`
  );

  if(!confirmed) return;

  button.disabled = true;
  const originalText = button.textContent;
  button.textContent = "\u09A1\u09BF\u09B2\u09BF\u099F \u09B9\u099A\u09CD\u099B\u09C7...";

  try{
    const { data, error } = await db
      .from("orders")
      .delete()
      .eq("id", id)
      .select("id")
      .maybeSingle();

    if(error) throw error;

    if(!data){
      throw new Error(
        "\u0985\u09B0\u09CD\u09A1\u09BE\u09B0 \u09A1\u09BF\u09B2\u09BF\u099F \u09B9\u09AF\u09BC\u09A8\u09BFà¥¤ Admin DELETE/SELECT policy \u098F\u09AC\u0982 RLS \u09AA\u09B0\u09C0\u0995\u09CD\u09B7\u09BE \u0995\u09B0\u09CBà¥¤"
      );
    }

    orders = orders.filter(order => String(order.id) !== String(id));
    renderOrders();

    alert(`\u0985\u09B0\u09CD\u09A1\u09BE\u09B0 #${id} \u09B8\u09AB\u09B2\u09AD\u09BE\u09AC\u09C7 \u09A1\u09BF\u09B2\u09BF\u099F \u09B9\u09AF\u09BC\u09C7\u099B\u09C7à¥¤`);
  }catch(error){
    console.error("Order delete failed:", error);
    alert("\u0985\u09B0\u09CD\u09A1\u09BE\u09B0 \u09A1\u09BF\u09B2\u09BF\u099F \u0995\u09B0\u09BE \u09AF\u09BE\u09AF\u09BC\u09A8\u09BF:\n" + error.message);
  }finally{
    button.disabled = false;
    button.textContent = originalText;
  }
}

function printReceipt(button){
  const card = button.closest(".order");
  if(!card) return;

  const id = card.dataset.orderId;
  const order = orders.find(item => String(item.id) === String(id));

  if(!order){
    alert("\u0985\u09B0\u09CD\u09A1\u09BE\u09B0 \u09AA\u09BE\u0993\u09AF\u09BC\u09BE \u09AF\u09BE\u09AF\u09BC\u09A8\u09BFà¥¤ Refresh \u0995\u09B0\u09C7 \u0986\u09AC\u09BE\u09B0 \u099A\u09C7\u09B7\u09CD\u099F\u09BE \u0995\u09B0\u09CBà¥¤");
    return;
  }

  const items = Array.isArray(order.items) ? order.items : [];

  const rows = items.map(item => {
    const qty = Number(item.quantity ?? item.qty ?? 0);
    const price = Number(item.unit_price ?? item.price ?? item.sale_price ?? 0);
    const packageType = item.package_type === "strip" ? "Strip" : "Box";

    return `<tr>
      <td>${escapeHtml(item.name || item.medicine_name || item.product_name || "\u0993\u09B7\u09C1\u09A7")}</td>
      <td>${escapeHtml(item.company || item.company_name || "-")}</td>
      <td><span class="package-tag">${qty} ${packageType}</span></td>
      <td>${money(price)} / ${packageType}</td>
      <td>${money(qty * price)}</td>
    </tr>`;
  }).join("");

  const w = window.open("", "_blank", "width=850,height=700");

  if(!w){
    alert("Receipt \u0996\u09C1\u09B2\u09A4\u09C7 browser popup allow \u0995\u09B0\u09CBà¥¤");

  w.document.write(`<!DOCTYPE html>

      th,td{border-bottom:1px solid #ddd;text-align:left;padding:10px 6px;font-size:13px}
      th{background:#f0f6f2}

      .muted{color:#666;font-size:12px}
      .package-tag{display:inline-block;padding:3px 8px;border-radius:6px;background:#e6f4ee;color:#0b6b4f;font-size:11px;font-weight:700}
      .print{padding:10px 15px;background:#075e46;color:white;border:0;border-radius:6px;cursor:pointer}
      @media print{.print{display:none}body{margin:0;padding:0}}
    </style>
  </head>
  <body>
    <header><h1>MEDISPOT BD</h1><p>Medicine Order Receipt</p></header>
    <div class="line info">
      <div><b>Order ID:</b> #${escapeHtml(order.id)}<br><b>Order Date:</b> ${escapeHtml(formatDate(order.created_at))}</div>
      <div><b>Status:</b> ${escapeHtml(String(order.status || "pending").toUpperCase())}</div>
    </div>
    <h2>\u0985\u09B0\u09CD\u09A1\u09BE\u09B0\u0995\u09BE\u09B0\u09C0\u09B0 \u09A4\u09A5\u09CD\u09AF</h2>
    <div class="info">

    <table>

async function enableNotifications(){
  if(!("Notification" in window)){
    alert("\u098F\u0987 \u09AC\u09CD\u09B0\u09BE\u0989\u099C\u09BE\u09B0\u09C7 \u09B8\u09BE\u09A7\u09BE\u09B0\u09A3 Browser Notification \u09B8\u09AE\u09B0\u09CD\u09A5\u09BF\u09A4 \u09A8\u09AF\u09BCà¥¤");
    return;
  }

  try{
    const permission = await Notification.requestPermission();
    notificationPermissionAsked = true;

    if(permission === "granted"){
      alert("Browser Notification \u0985\u09A8\u09C1\u09AE\u09A4\u09BF \u09A6\u09C7\u0993\u09AF\u09BC\u09BE \u09B9\u09AF\u09BC\u09C7\u099B\u09C7à¥¤ \u09A8\u09A4\u09C1\u09A8 \u0985\u09B0\u09CD\u09A1\u09BE\u09B0\u09C7\u09B0 Notification \u09AA\u09C7\u09A4\u09C7 Dashboard \u0996\u09CB\u09B2\u09BE \u09B0\u09BE\u0996\u09A4\u09C7 \u09B9\u09AC\u09C7à¥¤");
    }else{
      alert("Notification \u0985\u09A8\u09C1\u09AE\u09A4\u09BF \u09A6\u09C7\u0993\u09AF\u09BC\u09BE \u09B9\u09AF\u09BC\u09A8\u09BFà¥¤ Browser \u09AC\u09BE device settings-\u098F \u0985\u09A8\u09C1\u09AE\u09A4\u09BF \u09AA\u09B0\u09C0\u0995\u09CD\u09B7\u09BE \u0995\u09B0\u09CBà¥¤");
    }
  }catch(error){
    alert("Notification \u099A\u09BE\u09B2\u09C1 \u0995\u09B0\u09BE \u09AF\u09BE\u09AF\u09BC\u09A8\u09BF: " + error.message);
  }
}

function subscribeOrders(){
  // \u098F\u0995\u0987 Dashboard-\u098F \u098F\u0995\u09BE\u09A7\u09BF\u0995 channel \u09A4\u09C8\u09B0\u09BF \u09B9\u0993\u09AF\u09BC\u09BE \u0986\u099F\u0995\u09BE\u0993à¥¤
  if(ordersChannel) return;

  setConnectionStatus("Realtime \u09B8\u0982\u09AF\u09CB\u0997 \u09B9\u099A\u09CD\u099B\u09C7...", true);

  ordersChannel = db
    .channel("orders-dashboard")
    .on(
      "postgres_changes",
      {
        event: "INSERT",
        schema: "public",
        table: "orders"
      },
      payload => {
        const newOrder = payload.new || {};
        const id = newOrder.id;

        if(id !== undefined && id !== null){
          showBrowserNotification(
            "Medispot BD: \u09A8\u09A4\u09C1\u09A8 \u0985\u09B0\u09CD\u09A1\u09BE\u09B0",
            "\u0985\u09B0\u09CD\u09A1\u09BE\u09B0 #" + id + " \u098F\u09B8\u09C7\u099B\u09C7à¥¤",
            id
          );
        }

        // \u09A8\u09A4\u09C1\u09A8 \u0985\u09B0\u09CD\u09A1\u09BE\u09B0 \u09A4\u09BE\u09B2\u09BF\u0995\u09BE\u09AF\u09BC \u09A6\u09C7\u0996\u09BE\u09A8\u09CB\u09B0 \u099C\u09A8\u09CD\u09AF \u09AA\u09C1\u09A8\u09B0\u09BE\u09AF\u09BC \u09B2\u09CB\u09A1à¥¤
        loadOrders();
      }
    )
    .subscribe(status => {
      console.log("Orders Realtime status:", status);

      if(status === "SUBSCRIBED"){
        setConnectionStatus("Realtime \u09B8\u0982\u09AF\u09C1\u0995\u09CD\u09A4");
      }else if(status === "CHANNEL_ERROR"){
        setConnectionStatus("Realtime \u09B8\u0982\u09AF\u09CB\u0997\u09C7 \u09B8\u09AE\u09B8\u09CD\u09AF\u09BE", true);
      }else if(status === "TIMED_OUT"){
        setConnectionStatus("Realtime timeout â Refresh \u0995\u09B0\u09CB", true);
      }else if(status === "CLOSED"){
        setConnectionStatus("Realtime \u09AC\u09A8\u09CD\u09A7", true);
      }else{
        setConnectionStatus("Realtime: " + status, true);
      }
    });
}

async function startDashboard(){
  document.getElementById("login").style.display = "none";
  document.getElementById("dashboard").style.display = "block";

  await loadOrders();
  subscribeOrders();
}

db.auth.getSession().then(async ({ data, error }) => {
  if(error){
    console.error("Session check failed:", error);
    return;
  }

  if(data.session){
    await startDashboard();
  }
});

// \u09B2\u0997\u0987\u09A8 \u0985\u09A8\u09CD\u09AF \u099F\u09CD\u09AF\u09BE\u09AC \u09A5\u09C7\u0995\u09C7 \u09B6\u09C7\u09B7 \u09B9\u09B2\u09C7 \u09AC\u09BE session \u09B6\u09C7\u09B7 \u09B9\u09B2\u09C7 UI \u0986\u09AA\u09A1\u09C7\u099Fà¥¤
db.auth.onAuthStateChange((event, session) => {
  if(event === "SIGNED_OUT"){
    stopOrderSubscription();
    document.getElementById("dashboard").style.display = "none";
    document.getElementById("login").style.display = "block";
  }
});
</script>
